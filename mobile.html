<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drone WX">
<meta name="theme-color" content="#2b3033">
<title>Drone Weather</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--stretch:0px;--bg:#23282b;--card:#30363a;--card2:#3a4146;--tx:#f2f4f5;--mut:#aab2b7;--hi:#ff7a45;--lo:#3da5ff;--ok:#3ddc65;--warn:#ffc933;--bad:#ff5a4f;--acc:#f5c542}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{padding-top:env(safe-area-inset-top,0px)}
header{padding:10px 16px 0;flex:none}
.loc{display:flex;align-items:center;gap:8px;font-size:15px}
.loc b{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:none;border:0;color:var(--tx);font-size:19px;padding:4px 8px}
.hero{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.temp{font-size:70px;font-weight:600;line-height:1}
.cond{font-weight:600;margin-top:6px}.sub{font-size:13px;color:var(--mut)}
.hl{text-align:right;font-size:14px}.hl span{display:block;font-weight:600}
.big{font-size:56px}
main{padding:4px 14px 110px}
.page{display:none}.page.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{background:var(--card);border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:42px}
.row span:first-child{color:var(--mut);display:flex;gap:6px;align-items:center;font-size:14px}
.row b{font-weight:600;font-size:15px;text-align:right}
.full{grid-column:1/3}
.card{background:var(--card);border-radius:14px;padding:12px;margin-top:8px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.arc{width:100%;height:auto;display:block}
.sunl{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.center{text-align:center;font-size:13px;color:var(--mut);margin-top:2px}
.status{border-radius:16px;padding:16px;text-align:center;margin-top:6px;font-weight:700;font-size:22px}
.status small{display:block;font-weight:400;font-size:13px;margin-top:4px;opacity:.9}
.ok{background:#1f5a31}.warn{background:#6b5a14}.bad{background:#6e2622}
.compass{display:flex;align-items:center;justify-content:center;padding:6px 0}
.hours{display:flex;flex-direction:column;gap:6px}
.hr{display:grid;grid-template-columns:54px 1fr 1fr 1fr;gap:6px;align-items:center;background:var(--card);border-radius:10px;padding:8px 10px;font-size:13px}
.hr.h{background:none;color:var(--mut);font-size:11px;padding:0 10px;text-transform:uppercase}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%}
.day{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;font-size:14px}
.day em{font-style:normal;color:var(--mut);font-size:12px;display:block}
.lo{color:var(--lo)}.hi{color:var(--hi)}
#map{height:60vh;min-height:320px;border-radius:14px;overflow:hidden}
.rc{display:flex;gap:10px;align-items:center;margin-top:8px}
.rc button{background:#2a7de1;color:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:16px}
.rc input{flex:1}.rc span{font-size:13px;min-width:64px;text-align:right}
nav{position:fixed;left:0;right:0;bottom:calc(0px - var(--stretch));z-index:20;display:flex;background:#1c2023;border-top:1px solid #3a4146;padding-bottom:0}
@media (display-mode:standalone){nav{padding-bottom:calc(env(safe-area-inset-bottom,0px)*.5)}}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 7px;font-size:11px}
nav button i{display:block;font-style:normal;font-size:21px}
nav button.on{color:var(--acc)}
.alert{background:#5a2420;border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px}
.foot{text-align:center;color:var(--mut);font-size:11px;margin:12px 0 4px}.foot a{color:#6db3ff}
.err{padding:30px;text-align:center;color:var(--mut)}
dialog{background:var(--card);color:var(--tx);border:0;border-radius:14px;width:88%;max-width:380px}
dialog input{width:100%;padding:10px;border-radius:8px;border:0;font-size:16px;background:var(--card2);color:var(--tx)}
dialog div.r{padding:11px 4px;border-bottom:1px solid var(--card2)}
.adj{background:var(--card);color:var(--tx);border:0;border-radius:8px;width:34px;height:30px;font-size:16px}
</style></head><body>
<div id="app">
<header>
 <div class="loc"><span>📍</span><b id="place">Locating…</b>
  <button class="ib" id="bGps">⌖</button><button class="ib" id="bSearch">🔍</button><button class="ib" id="bRef">⟳</button></div>
 <div class="hero"><div><div class="temp" id="temp">--°</div><div class="cond" id="cond">&nbsp;</div><div class="sub" id="feels"></div></div>
  <div class="big" id="icon"></div>
  <div class="hl"><div class="sub">High</div><span class="hi" id="hi">--°</span><div class="sub" style="margin-top:8px">Low</div><span class="lo" id="lo">--°</span></div></div>
</header>
<main>
 <section class="page on" id="p0"></section>
 <section class="page" id="p1"></section>
 <section class="page" id="p2"></section>
 <section class="page" id="p3"><div id="map"></div>
  <div class="rc"><button id="play">▶</button><input type="range" id="rng" min="0" max="0" value="0"><span id="rt"></span></div>
  <div class="foot">Radar: <a href="https://github.com/JoshuaKimsey/LibreWXR">LibreWXR</a> · TWC colors · © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></div></section>
 <div class="foot" id="upd"></div><div class="foot"><a href="index.html?view=desktop">Switch to desktop version</a></div><div class="foot">Menu position <button class="adj" onclick="adj(-10)">−</button> <span id="sv">0</span> <button class="adj" onclick="adj(10)">+</button></div>
</main>
<nav><button class="on" data-t="0"><i>☁️</i>Details</button><button data-t="1"><i>🛸</i>Drone</button><button data-t="2"><i>🕒</i>Forecast</button><button data-t="3"><i>📡</i>Radar</button></nav>
</div>
<dialog id="dlg"><input id="q" placeholder="Search city…" autocomplete="off"><div id="res"></div><button class="ib" onclick="dlg.close()">Close</button></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@4.1.4/dist/satellite.min.js"></script>
<script>
const $=id=>document.getElementById(id),LW='https://api.librewxr.net';
let loc=JSON.parse(localStorage.getItem('loc')||'null')||{lat:30.5083,lon:-97.6789,name:'Round Rock, Texas'};
let SATS=null,KP=null,W,AQ,AL=[],map,layers=[],frames=[],fi=0,timer,radarReady=false;
const D=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const dir=d=>D[Math.round(d/22.5)%16],mi=m=>m/1609.34;
const WC=c=>c==0?['☀️','Clear sky']:c<=2?['⛅','Partly cloudy']:c==3?['☁️','Overcast']:c<=48?['🌫️','Fog']:c<=57?['🌦️','Drizzle']:c<=67?['🌧️','Rain']:c<=77?['🌨️','Snow']:c<=82?['🌧️','Showers']:c<=86?['🌨️','Snow showers']:['⛈️','Thunderstorm'];
const hrFmt=t=>new Date(t).toLocaleTimeString([], {hour:'numeric'}),tFmt=t=>new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const r0=x=>Math.round(x);
function aqiInfo(a){return a==null?['--','var(--mut)']:a<=50?['Good','var(--ok)']:a<=100?['Moderate','var(--warn)']:a<=150?['Unhealthy (SG)','#ff9a3c']:['Unhealthy','var(--bad)']}
function uvInfo(u){return u<3?'Low':u<6?'Moderate':u<8?'High':u<11?'Very High':'Extreme'}
async function load(){
 $('place').textContent=loc.name;
 const f='https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lon+
 '&current=temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,precipitation,cloud_cover,visibility,weather_code,is_day'+
 '&hourly=temperature_2m,precipitation_probability,precipitation,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,wind_speed_80m,wind_speed_120m,visibility,uv_index,weather_code'+
 '&daily=sunrise,sunset,uv_index_max,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,weather_code,wind_speed_10m_max'+
 '&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=7';
 try{
  const [a,b,c,k]=await Promise.allSettled([fetch(f).then(r=>r.json()),
   fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+loc.lat+'&longitude='+loc.lon+'&current=us_aqi,pm2_5&timezone=auto').then(r=>r.json()),
   fetch('https://api.weather.gov/alerts/active?point='+loc.lat.toFixed(4)+','+loc.lon.toFixed(4)).then(r=>r.json()),
   fetch('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json').then(r=>r.json())]);
  try{SATS=countSats(loc.lat,loc.lon,await getTLE())}catch(e){SATS=null}
  KP=null;if(k.status=='fulfilled'&&Array.isArray(k.value)&&k.value.length>1){const v=parseFloat(k.value[k.value.length-1][1]);if(!isNaN(v))KP=v}
  if(a.status!='fulfilled'||!a.value.current)throw 0;
  W=a.value;AQ=b.status=='fulfilled'?b.value.current:null;
  AL=c.status=='fulfilled'&&c.value.features?c.value.features.map(x=>x.properties):[];
  render();$('upd').innerHTML='Updated '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' · Weather: <a href="https://open-meteo.com">Open-Meteo</a> · Alerts: NWS (US)';
 }catch(e){$('p0').innerHTML='<div class="err">Couldn’t load weather. Check your connection and tap ⟳.</div>'}
}

async function getTLE(){const KEY='gpsTle';let c=null;try{c=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(c&&Date.now()-c.t<6*36e5)return c.d;
 try{const t=await fetch('https://celestrak.org/NORAD/elements/gp.php?GROUP=gps-ops&FORMAT=tle').then(r=>{if(!r.ok)throw 0;return r.text()});if(t.indexOf('1 ')<0)throw 0;try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),d:t}))}catch(e){}return t}catch(e){return c?c.d:null}}
function countSats(lat,lon,tle){if(!tle||!window.satellite)return null;const S=window.satellite,L=tle.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),now=new Date(),g=S.gstime(now),obs={latitude:lat*Math.PI/180,longitude:lon*Math.PI/180,height:0.1};let n=0,tot=0;
 for(let i=0;i<L.length-1;i++){if(L[i].startsWith('1 ')&&L[i+1].startsWith('2 ')){try{const rec=S.twoline2satrec(L[i],L[i+1]),pv=S.propagate(rec,now);if(!pv.position)continue;tot++;const el=S.ecfToLookAngles(obs,S.eciToEcf(pv.position,g)).elevation*180/Math.PI;if(el>=10)n++}catch(e){}i++}}
 return tot?n:null}
function nowIdx(){const n=W.current.time;let i=W.hourly.time.findIndex(t=>t>=n.slice(0,13));return i<0?0:i}
function arcSvg(id,a,b,now,k){
 const S=k=='sun',c=S?'#f5c542':'#a98bf0';let aa=a?+a:0,bb=b?+b:0;if(a&&b&&bb<aa)bb+=864e5;
 const has=a&&b,p=has?Math.max(0,Math.min(1,(+now-aa)/(bb-aa))):null,t=Math.PI*(1-(p||0)),x=100+85*Math.cos(t),y=95-85*Math.sin(t);
 const st=[[30,40],[55,22],[78,58],[120,30],[150,52],[40,72],[100,64],[165,30],[135,74],[72,36]].map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="1" fill="#fff" opacity=".55"/>`).join('');
 return `<svg viewBox="0 0 200 108" class="arc"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S?c:'#4a4470'}" stop-opacity="${S?.24:.7}"/><stop offset="1" stop-color="${S?c:'#2b2a45'}" stop-opacity="${S?.03:.15}"/></linearGradient>`+
 (S?`<radialGradient id="s${id}"><stop offset=".3" stop-color="#fff"/><stop offset=".5" stop-color="#ffe27a"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></radialGradient>`:`<mask id="m${id}"><rect width="200" height="108" fill="#fff"/><circle cx="${x+3.5}" cy="${y-2.5}" r="6" fill="#000"/></mask>`)+
 `</defs><path d="M15 95A85 85 0 0 1 185 95Z" fill="url(#g${id})"/>${S?'':st}`+
 (has?`<path d="M${x} ${y}A85 85 0 0 1 185 95" fill="none" stroke="${c}" stroke-opacity=".6" stroke-width="2" stroke-dasharray="4 4"/>${p>0?`<path d="M15 95A85 85 0 0 1 ${x} ${y}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`:''}`:'')+
 `<line x1="15" y1="95" x2="185" y2="95" stroke="${c}" stroke-opacity=".4"/><circle cx="15" cy="95" r="3" fill="${c}"/><circle cx="185" cy="95" r="3" fill="${c}" opacity=".7"/>`+
 (!has?'':S?`<circle cx="${x}" cy="${y}" r="13" fill="url(#s${id})"/><circle cx="${x}" cy="${y}" r="5.5" fill="#fff" stroke="#f5c542" stroke-width="2.5"/>`:`<circle cx="${x}" cy="${y}" r="7" fill="#e8e0ff" mask="url(#m${id})"/>`)+`</svg>`}
function dayInfo(a,b,n){const f=m=>Math.floor(m/36e5)+'h '+Math.round(m%36e5/6e4)+'m',s=b-n;
 return `<div style="text-align:center;font-size:12px;color:#aab2b7;margin-top:6px">Day: ${f(b-a)}</div><div style="text-align:center;font-size:12px;font-weight:700;color:#ff9a5a">${s>0&&n>=a?f(s)+' left':n<a?'Before sunrise':'Sun has set'}</div>`}
function sunCard(id,title,d,now){const a=new Date(d.sunrise[0]),b=new Date(d.sunset[0]),n=new Date(now);
 return `<div class="card"><h3>${title}</h3>${arcSvg(id,a,b,n,'sun')}<div class="sunl"><span style="color:#f5c542">${tFmt(d.sunrise[0])}</span><span style="color:#ff9a5a">${tFmt(d.sunset[0])}</span></div>${dayInfo(a,b,n)}</div>`}
function moonCard(){if(!window.SunCalc)return '';const dt=new Date(),mt=SunCalc.getMoonTimes(dt,loc.lat,loc.lon),p=SunCalc.getMoonIllumination(dt).phase,
 nm=p<.03||p>.97?'New Moon':p<.22?'Waxing Crescent':p<.28?'First Quarter':p<.47?'Waxing Gibbous':p<.53?'Full Moon':p<.72?'Waning Gibbous':p<.78?'Last Quarter':'Waning Crescent',
 f=x=>x?x.toLocaleTimeString([], {timeZone:W.timezone,hour:'numeric',minute:'2-digit'}):'—';
 return `<div class="card"><h3>Moon</h3>${arcSvg('m',mt.rise,mt.set,dt,'moon')}<div class="sunl"><span style="color:#a98bf0">${f(mt.rise)}</span><span style="color:#a98bf0">${f(mt.set)}</span></div><div class="center" style="color:#a98bf0;font-weight:700">${nm}</div></div>`}
function windArrow(d,s){return `<svg width="86" height="86" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#667" stroke-width="2"/><text x="50" y="16" fill="#aab" font-size="10" text-anchor="middle">N</text><g transform="rotate(${d+180} 50 50)"><path d="M50 18L62 56H54V82H46V56H38Z" fill="var(--acc)"/></g></svg>`}
function render(){
 const c=W.current,h=W.hourly,d=W.daily,i=nowIdx(),[ic,tx]=WC(c.weather_code);
 $('temp').textContent=r0(c.temperature_2m)+'°';$('cond').textContent=tx;$('feels').textContent='Feels like: '+r0(c.apparent_temperature)+'°';
 $('icon').textContent=ic;$('hi').textContent=r0(d.temperature_2m_max[0])+'°';$('lo').textContent=r0(d.temperature_2m_min[0])+'°';
 const vis=mi(c.visibility),[aq,aqc]=aqiInfo(AQ&&AQ.us_aqi),uv=h.uv_index[i]||0;
 // precip summary
 const n24=h.precipitation.slice(i,i+24),tot=n24.reduce((a,b)=>a+b,0),pk=Math.max(...h.precipitation_probability.slice(i,i+24));
 const first=h.precipitation.slice(i,i+24).findIndex((v,k)=>v>=0.005||h.precipitation_probability[i+k]>=50);
 const psum=tot<0.005&&pk<30?'No rain expected next 24h':(first==0?'Precipitation now':first>0?'Precip possible at '+hrFmt(h.time[i+first]):'Low chance')+' · peak '+pk+'%';
 const al=AL.length?AL.map(a=>`<div class="alert"><b>⚠️ ${a.event}</b><br>${a.headline||''}</div>`).join(''):'';
 $('p0').innerHTML=`<div class="grid">
 <div class="row"><span>💧 Humidity</span><b>${c.relative_humidity_2m}%</b></div>
 <div class="row"><span>🌡️ Dew Point</span><b>${r0(c.dew_point_2m)}°</b></div>
 <div class="row"><span>💨 Wind</span><b>${r0(c.wind_speed_10m)} mph ${dir(c.wind_direction_10m)}</b></div>
 <div class="row"><span>👁️ Visibility</span><b>${vis.toFixed(1)} mi</b></div>
 <div class="row"><span>🔆 UV Index</span><b>${uv.toFixed(1)} (${uvInfo(uv)})</b></div>
 <div class="row"><span>🍃 Air Quality</span><b style="color:${aqc}">AQI: ${AQ&&AQ.us_aqi!=null?AQ.us_aqi+' · ':''}${aq}</b></div>
 <div class="row full"><span>🌧️ Precip (24h)</span><b>${tot.toFixed(2)} in</b></div>
 <div class="row full" style="display:block"><span>☔ Summary</span><div style="margin-top:4px;font-size:14px">${psum}. Now: ${c.precipitation.toFixed(2)} in/h</div></div>
 <div class="row full"><span>🚩 Alerts</span><b>${AL.length?AL.length+' active':'None'}</b></div></div>${al}
 ${sunCard('a','Sun',d,c.time)}${moonCard()}`;
 // drone
 const g=c.wind_gusts_10m,ws=c.wind_speed_10m,w120=h.wind_speed_120m[i],pp=h.precipitation_probability[i];
 let st='ok',msg='Good to fly',why=[];
 if(ws>15||g>20||w120>25){st='warn';why.push('Elevated winds')}
 if(ws>22||g>30||w120>35){st='bad';why.push('Winds above safe limits')}
 if(vis<3){st=st=='bad'?'bad':'warn';why.push('Visibility under 3 mi')}
 if(vis<1){st='bad'}
 if(c.precipitation>0.005||pp>=60){st=st=='bad'?'bad':'warn';why.push('Precipitation risk')}
 if(!c.is_day){why.push('After sunset — night ops need lighting/waiver')}
 if(c.dew_point_2m>=c.temperature_2m-3)why.push('Fog/condensation risk');
 msg=st=='ok'?'Good to fly':st=='warn'?'Use caution':'Not recommended';
 $('p1').innerHTML=`<div class="status ${st}">${msg}<small>${why.join(' · ')||'Conditions within typical limits'}</small></div>
 <div class="card"><h3>Wind</h3><div class="compass">${windArrow(c.wind_direction_10m,ws)}<div style="margin-left:16px"><div style="font-size:32px;font-weight:700">${r0(ws)} mph</div><div class="sub">from ${dir(c.wind_direction_10m)} (${r0(c.wind_direction_10m)}°)</div><div class="sub">Gusts ${r0(g)} mph</div></div></div></div>
 <div class="grid" style="margin-top:8px"><div class="row"><span>Wind 33 ft</span><b>${r0(ws)} mph</b></div><div class="row"><span>Wind 260 ft</span><b>${r0(h.wind_speed_80m[i])} mph</b></div>
 <div class="row"><span>Wind 400 ft</span><b>${r0(w120)} mph</b></div><div class="row"><span>👁️ Visibility</span><b>${vis.toFixed(1)} mi</b></div>
 <div class="row"><span>☁️ Cloud Cover</span><b>${c.cloud_cover}%</b></div><div class="row"><span>🛰️ GPS Sats</span><b style="color:${SATS==null?'var(--mut)':SATS>=8?'var(--ok)':SATS>=6?'var(--warn)':'var(--bad)'}">${SATS==null?'--':SATS+' in view'}</b></div><div class="row"><span>🧲 Kp Index (${KP==null?'--':KP.toFixed(1)})</span><b style="color:${KP==null?'var(--mut)':KP<4?'var(--ok)':KP<5?'var(--warn)':'var(--bad)'}">${KP==null?'--':KP<4?'Good':KP<5?'Fair':KP<7?'Degraded':'Poor'}</b></div></div>
 ${sunCard('b','Sunrise / Sunset',d,c.time)}
 <div class="foot">Altitude winds are model estimates (10/80/120 m). GPS Sats is a prediction of satellites above 10° at your location, not what your drone has locked. Always check local rules, TFRs and your aircraft limits.</div>`;
 // forecast
 let hs='<div class="hours"><div class="hr h"><span>Hour</span><span>Cloud</span><span>Wind</span><span>Rain</span></div>';
 for(let k=i;k<i+24&&k<h.time.length;k++){const cc=h.cloud_cover[k],p=h.precipitation_probability[k];
  hs+=`<div class="hr"><b>${hrFmt(h.time[k])}</b><div>${cc}%<div class="bar"><i style="width:${cc}%;background:#9aa7b0"></i></div></div><div>${r0(h.wind_speed_10m[k])} mph ${dir(h.wind_direction_10m[k])}<div class="sub">gust ${r0(h.wind_gusts_10m[k])}</div></div><div>${p}% · ${h.precipitation[k].toFixed(2)}"<div class="bar"><i style="width:${p}%;background:#3da5ff"></i></div></div></div>`}
 hs+='</div><h3 style="margin:14px 2px 8px;font-size:13px;color:var(--mut)">7-DAY</h3>';
 d.time.forEach((t,k)=>{hs+=`<div class="day"><div><b>${k?new Date(t+'T12:00').toLocaleDateString([], {weekday:'long'}):'Today'}</b><em>${WC(d.weather_code[k])[1]} · ${d.precipitation_probability_max[k]}% · ${d.precipitation_sum[k].toFixed(2)} in</em></div><div class="sub">${r0(d.wind_speed_10m_max[k])} mph · <span class="lo">${r0(d.temperature_2m_min[k])}°</span> / <span class="hi">${r0(d.temperature_2m_max[k])}°</span></div></div>`});
 $('p2').innerHTML=hs;
 if(map)map.setView([loc.lat,loc.lon],8),mk&&mk.setLatLng([loc.lat,loc.lon]);
}
function dayLeft(d,now){const s=new Date(d.sunset[0])-new Date(now),dl=new Date(d.sunset[0])-new Date(d.sunrise[0]),f=m=>Math.floor(m/36e5)+'h '+Math.round(m%36e5/6e4)+'m';return 'Day: '+f(dl)+(s>0?' · '+f(s)+' of daylight left':' · Sun has set')}
// radar
let mk,base,cur,rl;
async function initRadar(){
 if(map){map.invalidateSize();return}
 map=L.map('map',{zoomControl:true,zoomSnap:1,fadeAnimation:false,markerZoomAnimation:false}).setView([loc.lat,loc.lon],8);
 const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,keepBuffer:1,updateWhenZooming:false,referrerPolicy:'origin',attribution:'© OpenStreetMap'}).addTo(map);
 let errs=0;osm.on('tileerror',()=>{if(++errs==3){map.removeLayer(osm);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rail/{z}/{x}/{y}.png'.replace('rail','rastertiles/voyager'),{maxZoom:18,keepBuffer:1,updateWhenZooming:false,subdomains:'abcd',attribution:'© OpenStreetMap contributors © CARTO'}).addTo(map).bringToBack()}});
 mk=L.marker([loc.lat,loc.lon]).addTo(map);
 try{
  const j=await fetch(LW+'/public/weather-maps.json').then(r=>r.json());
  const host=j.host||LW;frames=[...(j.radar.past||[]),...(j.radar.nowcast||[])];
  frames.forEach(f=>f.u=host+f.path+'/256/{z}/{x}/{y}/4/1_1.png');
  fi=Math.max(0,(j.radar.past||[]).length-1);
  rl=L.tileLayer(frames[fi].u,{opacity:.75,maxNativeZoom:10,maxZoom:18,zIndex:5,keepBuffer:0,updateWhenZooming:false,updateWhenIdle:true}).addTo(map);
  map.on('zoomstart',()=>{if(timer)$('play').click()});
  $('rng').max=frames.length-1;showF(fi);
 }catch(e){$('rt').textContent='Radar unavailable'}
}
function showF(n){if(!frames.length||!rl)return;fi=n;rl.setUrl(frames[n].u);$('rng').value=n;
 const t=new Date(frames[n].time*1000);$('rt').textContent=t.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+(n>=frames.findIndex(f=>f.time>Date.now()/1000)&&frames.some(f=>f.time>Date.now()/1000)?' ⏩':'')}
$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶'}else{$('play').textContent='❚❚';timer=setInterval(()=>showF((fi+1)%frames.length),600)}};
$('rng').oninput=e=>showF(+e.target.value);
// ui
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{window.scrollTo(0,0);document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));
 document.querySelectorAll('.page').forEach((p,k)=>p.classList.toggle('on',k==b.dataset.t));if(b.dataset.t==3)initRadar();$('upd').style.display=b.dataset.t==3?'none':''});
$('bRef').onclick=load;
function setLoc(l){loc=l;localStorage.setItem('loc',JSON.stringify(l));load()}
async function ipLoc(e){
 try{const j=await fetch('https://ipwho.is/').then(r=>r.json());if(!j.success)throw 0;
  setLoc({lat:j.latitude,lon:j.longitude,name:[j.city,j.region].filter(Boolean).join(', ')+' (approx.)'})}
 catch(x){alert('Couldn’t get your location automatically. Use the search (magnifier) to pick a city.')}}
$('bGps').onclick=()=>!navigator.geolocation?ipLoc():navigator.geolocation.getCurrentPosition(async p=>{
 let name='My location';try{const g=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+p.coords.latitude+'&lon='+p.coords.longitude).then(r=>r.json());const a=g.address||{};name=[a.city||a.town||a.village||a.hamlet,a.state].filter(Boolean).join(', ')||name}catch(e){}
 setLoc({lat:p.coords.latitude,lon:p.coords.longitude,name})},e=>ipLoc(e),{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
$('bSearch').onclick=()=>{dlg.showModal();$('q').focus()};
let st;$('q').oninput=e=>{clearTimeout(st);st=setTimeout(async()=>{const v=e.target.value.trim();if(v.length<2)return;
 const j=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&name='+encodeURIComponent(v)).then(r=>r.json());
 $('res').innerHTML='';(j.results||[]).forEach(r=>{const el=document.createElement('div');el.className='r';el.textContent=[r.name,r.admin1,r.country].filter(Boolean).join(', ');
  el.onclick=()=>{dlg.close();setLoc({lat:r.latitude,lon:r.longitude,name:[r.name,r.admin1].filter(Boolean).join(', ')})};$('res').appendChild(el)})},300)};
load();setInterval(load,600000);
