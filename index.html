<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather</title><style>body{background:#23282b;color:#f2f4f5;font:16px -apple-system,system-ui,sans-serif;text-align:center;padding:40px}a{color:#6db3ff}</style></head><body>
<p>Loading weather…</p><p><a href="mobile.html">Phone version</a> · <a href="desktop.html">Desktop version</a></p>
<script>
(function(){
 var q=new URLSearchParams(location.search),v=q.get("view");
 if(v==="mobile"||v==="desktop"){try{localStorage.setItem("view",v)}catch(e){}}
 else{try{v=localStorage.getItem("view")}catch(e){}}
 if(v!=="mobile"&&v!=="desktop"){
  var ua=navigator.userAgent,short=Math.min(screen.width,screen.height);
  var phone=/iPhone|iPod|Android.+Mobile|Windows Phone/i.test(ua)||(matchMedia("(pointer:coarse)").matches&&short<700);
  v=phone?"mobile":"desktop";
 }
 location.replace(v+".html");
})();
</script></body></html>
